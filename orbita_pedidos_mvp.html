<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos | Orbita IA</title>
  <style>
    :root {
      --bg: #f5f8fc;
      --panel: #ffffff;
      --panel-soft: #f8fbff;
      --border: #dfe7f1;
      --border-strong: #cdd9e8;
      --text: #0b1736;
      --muted: #6e7f99;
      --blue: #3284ff;
      --blue-dark: #1769e0;
      --cyan: #67c7e8;
      --green: #11b981;
      --amber: #f59e0b;
      --shadow: 0 8px 28px rgba(20, 51, 88, .08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      padding: 30px;
    }

    .shell {
      max-width: 1500px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 7px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -.03em;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .refresh {
      border: 1px solid var(--border);
      background: white;
      border-radius: 12px;
      min-width: 44px;
      height: 44px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(20, 51, 88, .05);
      font-size: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 19px 21px;
      box-shadow: 0 4px 16px rgba(20, 51, 88, .04);
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.03em;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.3fr .5fr .5fr auto;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 22px;
      box-shadow: 0 4px 16px rgba(20, 51, 88, .04);
    }

    .input, .select {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fbfdff;
      padding: 0 13px;
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .input:focus, .select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(50,132,255,.09);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 13px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .section-note {
      color: var(--muted);
      font-size: 13px;
    }

    .orders-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
    }

    .order-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      position: relative;
    }

    .order-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, var(--blue), var(--cyan));
    }

    .order-main {
      padding: 20px 20px 15px 23px;
      flex: 1;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 17px;
    }

    .order-id {
      font-size: 12px;
      font-weight: 800;
      color: var(--blue);
      letter-spacing: .06em;
    }

    .customer {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .time {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      padding-top: 2px;
    }

    .badge-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: #eef5ff;
      color: var(--blue-dark);
    }

    .badge.green {
      background: #eafaf4;
      color: #087957;
    }

    .badge.amber {
      background: #fff7e7;
      color: #a65f00;
    }

    .info {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 7px 11px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .info dt {
      color: var(--muted);
      font-weight: 700;
    }

    .info dd {
      margin: 0;
      font-weight: 650;
      line-height: 1.35;
    }

    .summary {
      background: var(--panel-soft);
      border: 1px solid #e5edf7;
      border-radius: 12px;
      padding: 12px 13px;
    }

    .summary-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .items {
      margin: 0;
      padding-left: 20px;
      color: #253651;
      line-height: 1.55;
      font-size: 13px;
    }

    .order-actions {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 10px;
      border-top: 1px solid var(--border);
      padding: 13px 15px 15px 18px;
      background: #fbfdff;
    }

    button {
      font-family: inherit;
    }

    .btn {
      height: 46px;
      border-radius: 11px;
      border: 1px solid var(--border-strong);
      background: white;
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
      transition: .15s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-print {
      border-color: var(--blue);
      background: var(--blue);
      color: white;
      box-shadow: 0 7px 18px rgba(50,132,255,.22);
      font-size: 14px;
    }

    .btn-print:hover {
      background: var(--blue-dark);
    }

    .empty {
      display: none;
      text-align: center;
      background: white;
      border: 1px dashed var(--border-strong);
      border-radius: 16px;
      padding: 50px 20px;
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 16, 35, .52);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      z-index: 20;
    }

    .modal {
      width: min(720px, 100%);
      max-height: 88vh;
      overflow: auto;
      background: white;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.22);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-body { padding: 20px; }

    .modal-close {
      border: 0;
      background: #f0f4f9;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
    }

    .print-sheet {
      display: none;
    }

    @media (max-width: 1150px) {
      .orders-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }

    @media (max-width: 800px) {
      .app { padding: 18px; }
      .stats, .orders-grid { grid-template-columns: 1fr; }
      .filters { grid-template-columns: 1fr; }
      .topbar { align-items: center; }
    }

    @media print {
      @page {
        size: A4;
        margin: 12mm;
      }

      body * {
        visibility: hidden !important;
      }

      #print-sheet,
      #print-sheet * {
        visibility: visible !important;
      }

      #print-sheet {
        display: block !important;
        position: absolute;
        inset: 0;
        width: 100%;
        background: white;
        color: black;
        font-family: Arial, sans-serif;
      }

      .print-title {
        text-align: center;
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 4px;
      }

      .print-subtitle {
        text-align: center;
        font-size: 12px;
        margin-bottom: 18px;
      }

      .print-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 22px;
        border-top: 1px solid #222;
        border-bottom: 1px solid #222;
        padding: 10px 0;
        font-size: 12px;
      }

      .print-items {
        margin-top: 18px;
        font-size: 14px;
      }

      .print-item {
        display: flex;
        gap: 10px;
        padding: 7px 0;
        border-bottom: 1px dotted #999;
      }

      .checkbox {
        width: 16px;
        height: 16px;
        border: 1.5px solid #111;
        flex: 0 0 auto;
        margin-top: 1px;
      }

      .print-notes {
        margin-top: 20px;
        padding-top: 12px;
        border-top: 1px solid #222;
        font-size: 12px;
      }

      .signature {
        margin-top: 36px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        font-size: 12px;
      }

      .signature div {
        border-top: 1px solid #222;
        padding-top: 5px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="shell">
      <div class="topbar">
        <div>
          <div class="eyebrow">Orbita IA · Operación</div>
          <h1>Pedidos para alistar</h1>
          <div class="subtitle">Revisa los pedidos activos y envíalos a impresión cuando el equipo esté listo.</div>
        </div>
        <button class="refresh" title="Actualizar" onclick="location.reload()">↻</button>
      </div>

      <section class="stats">
        <div class="stat">
          <div class="stat-label">Pedidos activos</div>
          <div class="stat-value" id="statActive">6</div>
        </div>
        <div class="stat">
          <div class="stat-label">Nuevos hoy</div>
          <div class="stat-value">5</div>
        </div>
        <div class="stat">
          <div class="stat-label">Pendientes de imprimir</div>
          <div class="stat-value" id="statPending">6</div>
        </div>
      </section>

      <section class="filters">
        <input id="search" class="input" placeholder="Buscar por nombre, teléfono, pedido o dirección..." />
        <select id="deliveryFilter" class="select">
          <option value="">Todas las entregas</option>
          <option value="Domicilio">Domicilio</option>
          <option value="Recogida">Recogida</option>
        </select>
        <select id="statusFilter" class="select">
          <option value="">Todos los estados</option>
          <option value="Nuevo">Nuevo</option>
          <option value="Listo">Listo para alistar</option>
        </select>
        <button class="btn" onclick="clearFilters()">Limpiar</button>
      </section>

      <div class="section-head">
        <div>
          <div class="section-title">Pedidos activos</div>
          <div class="section-note">Los pedidos más recientes aparecen primero.</div>
        </div>
      </div>

      <section id="ordersGrid" class="orders-grid"></section>
      <div id="emptyState" class="empty">No hay pedidos que coincidan con los filtros.</div>
    </div>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="order-id" id="modalId"></div>
          <div class="customer" id="modalCustomer"></div>
        </div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <section id="print-sheet" class="print-sheet"></section>

  <script>
    // MVP: datos simulados. Luego reemplaza este arreglo por datos provenientes del backend/DB.
    const orders = [
      {
        id: "PD-1058",
        customer: "Carlos Rodríguez",
        phone: "300 123 4567",
        time: "Hace 4 min",
        status: "Nuevo",
        delivery: "Domicilio",
        address: "Cra. 10 #20-30, Apto 402",
        items: [
          "2 x Leche deslactosada Alpina 1L",
          "1 x Huevos AA x30",
          "3 x Arroz Diana 1 kg",
          "4 x Aguacate Hass",
          "2 x Coca-Cola 1.5L"
        ],
        notes: "Si no hay aguacate Hass, llamar antes de reemplazar."
      },
      {
        id: "PD-1057",
        customer: "Laura Méndez",
        phone: "310 555 0192",
        time: "Hace 11 min",
        status: "Listo",
        delivery: "Recogida",
        address: "Recoge en tienda",
        items: [
          "1 x Detergente Ariel 2 kg",
          "2 x Pan tajado integral",
          "1 x Queso mozzarella 500 g",
          "6 x Yogurt griego natural"
        ],
        notes: "Cliente solicita bolsas separadas para aseo y alimentos."
      },
      {
        id: "PD-1056",
        customer: "Andrés Gómez",
        phone: "315 234 8877",
        time: "Hace 18 min",
        status: "Nuevo",
        delivery: "Domicilio",
        address: "Calle 72 #18-44",
        items: [
          "3 x Agua mineral 600 ml",
          "2 x Pechuga de pollo 1 kg",
          "1 x Café molido 500 g",
          "2 x Tomate chonto 1 kg"
        ],
        notes: "Tocar timbre en portería."
      },
      {
        id: "PD-1055",
        customer: "Mónica Salazar",
        phone: "301 889 4412",
        time: "Hace 27 min",
        status: "Listo",
        delivery: "Domicilio",
        address: "Carrera 23 #63-18, Casa 7",
        items: [
          "1 x Aceite vegetal 3L",
          "5 x Atún en agua",
          "2 x Pasta spaghetti 500 g",
          "1 x Papel higiénico x12"
        ],
        notes: "Sin sustituciones."
      },
      {
        id: "PD-1054",
        customer: "Juan Felipe Ortiz",
        phone: "320 447 1123",
        time: "Hace 39 min",
        status: "Nuevo",
        delivery: "Recogida",
        address: "Recoge en tienda",
        items: [
          "2 x Harina de maíz 1 kg",
          "1 x Mantequilla 250 g",
          "1 x Queso campesino 500 g"
        ],
        notes: "Confirmar disponibilidad de queso."
      },
      {
        id: "PD-1053",
        customer: "Natalia Pérez",
        phone: "312 220 7980",
        time: "Hace 51 min",
        status: "Listo",
        delivery: "Domicilio",
        address: "Calle 95 #11-36, Torre 2",
        items: [
          "1 x Cereal integral",
          "2 x Leche entera 1L",
          "1 x Banano 1 kg",
          "1 x Manzana roja 1 kg",
          "2 x Agua con gas 1L"
        ],
        notes: "Llamar al llegar."
      }
    ];

    const grid = document.getElementById("ordersGrid");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("search");
    const deliveryFilter = document.getElementById("deliveryFilter");
    const statusFilter = document.getElementById("statusFilter");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function statusBadge(status) {
      return status === "Nuevo"
        ? '<span class="badge amber">● Nuevo</span>'
        : '<span class="badge green">✓ Listo para alistar</span>';
    }

    function renderOrders() {
      const q = searchInput.value.trim().toLowerCase();
      const delivery = deliveryFilter.value;
      const status = statusFilter.value;

      const filtered = orders.filter(o => {
        const haystack = [o.id, o.customer, o.phone, o.address, ...o.items, o.notes].join(" ").toLowerCase();
        return (!q || haystack.includes(q))
          && (!delivery || o.delivery === delivery)
          && (!status || o.status === status);
      });

      grid.innerHTML = filtered.map(o => `
        <article class="order-card">
          <div class="order-main">
            <div class="order-top">
              <div>
                <div class="order-id">${escapeHtml(o.id)}</div>
                <div class="customer">${escapeHtml(o.customer)}</div>
              </div>
              <div class="time">${escapeHtml(o.time)}</div>
            </div>

            <div class="badge-row">
              ${statusBadge(o.status)}
              <span class="badge">${escapeHtml(o.delivery)}</span>
              <span class="badge">${o.items.length} productos</span>
            </div>

            <dl class="info">
              <dt>Teléfono</dt><dd>${escapeHtml(o.phone)}</dd>
              <dt>Entrega</dt><dd>${escapeHtml(o.address)}</dd>
            </dl>

            <div class="summary">
              <div class="summary-title">Resumen del pedido</div>
              <ul class="items">
                ${o.items.slice(0,4).map(item => `<li>${escapeHtml(item)}</li>`).join("")}
                ${o.items.length > 4 ? `<li><strong>+${o.items.length - 4} producto(s) más</strong></li>` : ""}
              </ul>
            </div>
          </div>

          <div class="order-actions">
            <button class="btn" onclick="openDetails('${o.id}')">Ver detalle</button>
            <button class="btn btn-print" onclick="printOrder('${o.id}')">🖨 Imprimir pedido</button>
          </div>
        </article>
      `).join("");

      emptyState.style.display = filtered.length ? "none" : "block";
      document.getElementById("statActive").textContent = orders.length;
      document.getElementById("statPending").textContent = orders.length;
    }

    function getOrder(id) {
      return orders.find(o => o.id === id);
    }

    function openDetails(id) {
      const o = getOrder(id);
      if (!o) return;

      document.getElementById("modalId").textContent = o.id;
      document.getElementById("modalCustomer").textContent = o.customer;
      document.getElementById("modalBody").innerHTML = `
        <div class="badge-row">
          ${statusBadge(o.status)}
          <span class="badge">${escapeHtml(o.delivery)}</span>
        </div>
        <dl class="info" style="grid-template-columns:120px 1fr">
          <dt>Teléfono</dt><dd>${escapeHtml(o.phone)}</dd>
          <dt>Dirección</dt><dd>${escapeHtml(o.address)}</dd>
          <dt>Observaciones</dt><dd>${escapeHtml(o.notes || "Sin observaciones")}</dd>
        </dl>
        <div class="summary">
          <div class="summary-title">Pedido completo</div>
          <ul class="items">
            ${o.items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}
          </ul>
        </div>
        <button class="btn btn-print" style="width:100%;margin-top:16px" onclick="printOrder('${o.id}')">🖨 Imprimir pedido</button>
      `;
      document.getElementById("modalBackdrop").style.display = "flex";
    }

    function closeModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById("modalBackdrop").style.display = "none";
    }

    function printOrder(id) {
      const o = getOrder(id);
      if (!o) return;

      const sheet = document.getElementById("print-sheet");
      sheet.innerHTML = `
        <div class="print-title">ORDEN DE ALISTAMIENTO</div>
        <div class="print-subtitle">${escapeHtml(o.id)} · Generado desde Orbita IA</div>

        <div class="print-meta">
          <div><strong>Cliente:</strong> ${escapeHtml(o.customer)}</div>
          <div><strong>Teléfono:</strong> ${escapeHtml(o.phone)}</div>
          <div><strong>Tipo:</strong> ${escapeHtml(o.delivery)}</div>
          <div><strong>Dirección:</strong> ${escapeHtml(o.address)}</div>
        </div>

        <div class="print-items">
          <strong>PRODUCTOS</strong>
          ${o.items.map(item => `
            <div class="print-item">
              <span class="checkbox"></span>
              <span>${escapeHtml(item)}</span>
            </div>
          `).join("")}
        </div>

        <div class="print-notes">
          <strong>OBSERVACIONES</strong><br>
          ${escapeHtml(o.notes || "Sin observaciones")}
        </div>

        <div class="signature">
          <div>Preparado por</div>
          <div>Facturado por</div>
        </div>
      `;

      // El navegador abrirá su diálogo estándar de impresión.
      setTimeout(() => window.print(), 60);
    }

    function clearFilters() {
      searchInput.value = "";
      deliveryFilter.value = "";
      statusFilter.value = "";
      renderOrders();
    }

    [searchInput, deliveryFilter, statusFilter].forEach(el => {
      el.addEventListener("input", renderOrders);
      el.addEventListener("change", renderOrders);
    });

    renderOrders();
  </script>
</body>
</html>
